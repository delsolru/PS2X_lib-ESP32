sentence=LROB.RU edition: PlayStation 2 controller (DualShock, Guitar Hero, 2.4 GHz pads) for AVR and ESP32, based on PS2X_lib 1.9.
paragraph=GPLv3 derivative of the original PS2X_lib 1.9 by Bill Porter, Shutter, Eric Wetzel and Kurt Eckhardt (github.com/madsci1016/Arduino-PS2X). Same API, drop-in replacement; adds ESP32 support (direct GPIO registers, cycle accurate timing), clear error codes, hot-plug recovery, pin validation and runtime tunable bit timing. The PS/2 protocol, command set and button tables come from the original library; see README.md and README.ru.md for the full list of changes.
